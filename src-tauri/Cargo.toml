[package]
name = "remote-keyboard"
version = "0.1.0"
description = "Custom keyboard rebinds for Microsoft Remote Desktop"
authors = ["Sindre"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (matters on Windows).
name = "remote_keyboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# AXIsProcessTrusted / AXIsProcessTrustedWithOptions wrapper (Accessibility).
macos-accessibility-client = "0.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
